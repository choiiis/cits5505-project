<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Restaurants | TableTrail</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/common.css">
    <link rel="stylesheet" href="./css/search.css">
</head>

<body>
    <div id="headerInclude"></div>

    <main class="search-page">
        <section class="search-hero-section">
            <div class="container py-4">
                <form class="search-bar shared-search-bar row g-2 align-items-center" id="searchForm">
                    <div class="col-lg-5">
                        <input class="form-control form-control-lg" id="keywordSearch" name="q"
                            placeholder="Restaurant, cuisine, or dish" aria-label="Search restaurants">
                    </div>

                    <div class="col-lg-4">
                        <input class="form-control form-control-lg" id="locationSearch" name="location"
                            placeholder="Suburb or city" aria-label="Search location">
                    </div>

                    <div class="col-lg-3 d-flex gap-2">
                        <button class="btn btn-success btn-lg flex-fill" type="submit">
                            Search
                        </button>

                        <button class="btn btn-outline-dark btn-lg map-btn shared-map-btn" id="mapButton" type="button">
                            Map
                        </button>
                    </div>
                </form>
            </div>
        </section>

        <section class="search-results-section">
            <div class="container py-4">
                <div class="shared-page-header mb-4">
                    <div class="shared-page-header__content">
                        <h1 class="h3 fw-bold mb-1">Search Results</h1>
                        <p class="text-secondary" id="summaryText">
                            Loading results
                        </p>
                    </div>
                </div>

                <div class="search-filter-placeholder mb-4">
                    Filters will be added here.
                </div>

                <div class="row g-3" id="resultsList">
                    <div class="col-12">
                        <div class="search-empty-message">
                            Restaurant cards will be added here.
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div id="footerInclude"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/common.js"></script>
    <script src="./js/data.js"></script>
    <script src="./js/search.js"></script>
</body>

</html>
