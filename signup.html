<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign Up | TableTrail</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/styles.css" rel="stylesheet">
</head>
<body data-page="signup">
  <main class="auth-shell container d-flex align-items-center justify-content-center py-5">
    <section class="form-card bg-white shadow-sm p-4 w-100">
      <h1 class="h3 fw-bold">Create your account</h1>
      <p class="text-secondary">Join as a diner or restaurant owner.</p>
      <form>
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Full name</label>
            <input class="form-control" placeholder="Your name">
          </div>
          <div class="col-md-6">
            <label class="form-label">Role</label>
            <select class="form-select">
              <option>Registered User</option>
              <option>Restaurant Owner</option>
            </select>
          </div>
          <div class="col-12">
            <label class="form-label">Email</label>
            <input class="form-control" type="email" placeholder="you@example.com">
          </div>
          <div class="col-12">
            <label class="form-label">Password</label>
            <input class="form-control" type="password" placeholder="Create password">
          </div>
        </div>
        <button class="btn btn-success w-100 mt-3" type="button">Sign up</button>
      </form>
      <p class="small mt-3 mb-0">Already have an account? <a href="login.html">Login</a></p>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/components.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
