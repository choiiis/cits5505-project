<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign up | TableTrail</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="./css/common.css" rel="stylesheet">
  <link href="./css/signup.css" rel="stylesheet">
</head>
<body data-page="signup">
  <div id="headerInclude"></div>

  <main class="auth-shell signup-shell container d-flex align-items-center justify-content-center py-5">
    <section class="form-card signup-card bg-white shadow-sm p-4 w-100">
      <h1 class="h3 fw-bold">Create your account</h1>
      <p class="text-secondary">Join as a diner or restaurant owner.</p>

      <form id="signupForm" novalidate>
        <div class="row g-3">
          <div class="col-12 col-md-6">
            <label class="form-label" for="fullNameInput">Full name</label>
            <input
              class="form-control"
              id="fullNameInput"
              name="fullName"
              type="text"
              placeholder="Your name"
              autocomplete="name"
              required>
            <div class="invalid-feedback">Please enter your full name.</div>
          </div>

          <div class="col-12 col-md-6">
            <label class="form-label" for="roleSelect">Role</label>
            <select class="form-select" id="roleSelect" name="role" required>
              <option value="user" selected>Registered User</option>
              <option value="owner">Restaurant Owner</option>
            </select>
          </div>

          <div class="col-12">
            <label class="form-label" for="emailInput">Email</label>
            <input
              class="form-control"
              id="emailInput"
              name="email"
              type="email"
              placeholder="you@example.com"
              autocomplete="email"
              required>
            <div class="invalid-feedback">Please enter a valid email address.</div>
          </div>

          <div class="col-12">
            <label class="form-label" for="passwordInput">Password</label>
            <input
              class="form-control"
              id="passwordInput"
              name="password"
              type="password"
              placeholder="Create password"
              autocomplete="new-password"
              required>
            <div class="invalid-feedback">Password must be at least 6 characters.</div>
          </div>
        </div>

        <div class="owner-fields mt-3 d-none" id="ownerFields">
          <div class="row g-3">
            <div class="col-12">
              <label class="form-label" for="restaurantNameInput">Restaurant name</label>
              <input
                class="form-control owner-input"
                id="restaurantNameInput"
                name="restaurantName"
                type="text"
                placeholder="Restaurant name"
                autocomplete="organization">
              <div class="invalid-feedback">Please enter the restaurant name.</div>
            </div>

            <div class="col-12 col-md-6">
              <label class="form-label" for="abnInput">ABN number</label>
              <input
                class="form-control owner-input"
                id="abnInput"
                name="abn"
                type="text"
                inputmode="numeric"
                placeholder="11 digit ABN"
                autocomplete="off">
              <div class="invalid-feedback">Please enter an 11 digit ABN.</div>
            </div>

            <div class="col-12 col-md-6">
              <label class="form-label" for="contactNumberInput">Contact number</label>
              <input
                class="form-control owner-input"
                id="contactNumberInput"
                name="contactNumber"
                type="tel"
                placeholder="Business contact number"
                autocomplete="tel">
              <div class="invalid-feedback">Please enter a valid contact number.</div>
            </div>
          </div>
        </div>

        <button class="btn btn-success w-100 signup-submit" type="submit">Sign up</button>
        <p class="signup-message mb-0 mt-3" id="signupMessage" role="status" aria-live="polite"></p>
      </form>

      <p class="signup-login-link mb-0">
        Already have an account? <a href="login.html">Login</a>
      </p>
    </section>
  </main>

  <div id="footerInclude"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./js/common.js"></script>
  <script src="./js/signup.js"></script>
</body>
</html>
