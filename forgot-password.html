<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password | TableTrail</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="./css/common.css" rel="stylesheet">
  <link href="./css/forgot-password.css" rel="stylesheet">
</head>
<body data-page="forgot-password">
  <div id="headerInclude"></div>

  <main class="auth-shell forgot-password-shell container d-flex align-items-center justify-content-center py-5">
    <section class="form-card forgot-password-card bg-white shadow-sm p-4 w-100">
      <h1 class="h3 fw-bold">Reset password</h1>
      <p class="text-secondary">Enter your email and receive reset instructions.</p>

      <form id="forgotPasswordForm" novalidate>
        <div class="mb-3">
          <label class="form-label" for="emailInput">Email</label>
          <input
            class="form-control"
            id="emailInput"
            name="email"
            type="email"
            placeholder="you@example.com"
            autocomplete="email"
            required>
          <div class="invalid-feedback">Please enter a valid email address.</div>
        </div>

        <button class="btn btn-success w-100 forgot-password-submit" type="submit">Send reset link</button>
        <p class="forgot-password-message mb-0 mt-3" id="forgotPasswordMessage" role="status" aria-live="polite"></p>
      </form>

      <p class="forgot-password-login-link mb-0">
        <a href="login.html">Back to login</a>
      </p>
    </section>
  </main>

  <div id="footerInclude"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./js/common.js"></script>
  <script src="./js/forgot-password.js"></script>
</body>
</html>
