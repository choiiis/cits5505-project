<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot Password | TableTrail</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/styles.css" rel="stylesheet">
</head>
<body data-page="forgot">
  <main class="auth-shell container d-flex align-items-center justify-content-center py-5">
    <section class="form-card bg-white shadow-sm p-4 w-100">
      <h1 class="h3 fw-bold">Reset password</h1>
      <p class="text-secondary">Enter your email and receive reset instructions.</p>
      <form>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input class="form-control" type="email" placeholder="you@example.com">
        </div>
        <button class="btn btn-success w-100" type="button">Send reset link</button>
      </form>
      <p class="small mt-3 mb-0"><a href="login.html">Back to login</a></p>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
