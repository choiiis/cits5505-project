<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Detail | TableTrail</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/common.css">
    <link rel="stylesheet" href="./css/restaurant_detail.css">
</head>

<body>
    <div id="headerInclude"></div>

    <main>
        <!-- Hero Banner -->
        <section class="restaurant-hero">
            <img src="https://images.unsplash.com/photo-1513104890138-7c749659a591?auto=format&fit=crop&w=1200&q=80"
                alt="Restaurant banner image">

            <!-- bookmark icon -->
            <button class="restaurant-bookmark-btn" type="button">
                ♡
            </button>
            <div class="restaurant-hero-overlay">
                <div class="container">
                    <p class="restaurant-category" id="categoryBadge">Italian</p>

                    <h1 id="restaurantName">Laneway Pizza Co.</h1>

                    <p class="restaurant-rating-line">
                        <span id="starText">★★★★★</span>
                        <span id="ratingText">4.7 · 512 reviews</span>
                    </p>
                </div>
            </div>
        </section>
        <!-- Restaurant Info Content -->
        <section class="restaurant-info-section">
            <div class="container py-4">

                <!-- Location & Hours -->
                <section class="detail-section">
                    <div class="section-heading-row">
                        <h2>Location & Hours</h2>
                    </div>

                    <div class="location-hours-grid">

                        <!-- Map and Address -->
                        <div class="location-column">
                            <div class="map-placeholder">
                                Map
                            </div>

                            <div class="address-card">
                                <div class="address-icon">
                                    📍
                                </div>

                                <div>
                                    <span class="address-label">Address</span>
                                    <p class="restaurant-address">
                                        Barrack St, Perth, WA 6000
                                    </p>
                                </div>
                            </div>
                        </div>

                        <!-- Opening Hours -->
                        <div class="hours-card">
                            <div class="open-badge">
                                ● Open now
                            </div>
                            <div class="hours-list">
                                <div class="today">
                                    <span>Mon</span>
                                    <p>7:00 AM - 11:00 PM</p>
                                </div>

                                <div>
                                    <span>Tue</span>
                                    <p>7:00 AM - 11:00 PM</p>
                                </div>

                                <div>
                                    <span>Wed</span>
                                    <p>7:00 AM - 11:00 PM</p>
                                </div>

                                <div>
                                    <span>Thu</span>
                                    <p>7:00 AM - 11:00 PM</p>
                                </div>

                                <div>
                                    <span>Fri</span>
                                    <p>7:00 AM - 12:00 AM</p>
                                </div>

                                <div>
                                    <span>Sat</span>
                                    <p>8:00 AM - 12:00 AM</p>
                                </div>

                                <div>
                                    <span>Sun</span>
                                    <p>8:00 AM - 10:00 PM</p>
                                </div>
                            </div>
                        </div>

                    </div>
                </section>

            </div>
        </section>
    </main>

    <div id="footerInclude"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/common.js"></script>
    <script src="./js/restaurant_detail.js"></script>
</body>

</html>
