<!DOCTYPE html>
<html>

<head>
    <title>Review Page</title>
    <style>
        .wrapper {
            width: 80%;
            margin: 40px auto;
        }

        h1 {
            margin-bottom: 8px;
        }

        .review-list {
            margin-top: 40px;
        }

        .review-element {
            background: white;
            border: 1px solid #ccc;
            padding: 16px;
            margin-bottom: 16px;
        }

        .review-header {
            margin-bottom: 8px;
        }

        .reviewer {
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="wrapper">
        <h1>Reviews</h1>
        <section class="review-list">
            <div class="review-element">
                <div class="review-header">
                    <div class="reviewer">Michelle</div>
                    <div>★★★★★</div>
                </div>
                <p>Delicious food and nice atmosphere</p>
            </div>

            <div class="review-element">
                <div class="review-header">
                    <div class="reviewer">David</div>
                    <div>★★★★☆</div>
                </div>
            </div>

            <div class="review-element">
                <div class="review-header">
                    <div class="reviewer">Sophie</div>
                    <div>★★★★★</div>
                </div>
                <p>Great service!</p>
            </div>
        </section>
    </div>
</body>

</html>
