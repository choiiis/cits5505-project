<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile | TableTrail</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="./css/common.css" rel="stylesheet">
  <link href="./css/profile.css" rel="stylesheet">
</head>
<body data-page="profile">
  <div id="headerInclude"></div>

  <main class="profile-page">
    <section class="container py-4 py-md-5">
      <div class="shared-page-header mb-4">
        <div class="shared-page-header__content">
          <h1 class="h3 fw-bold mb-2">My Profile</h1>
          <p class="text-secondary">Manage your account details, reviews, and account settings.</p>
        </div>
        <a class="btn btn-success align-self-start align-self-md-center" href="search.html">Write a review</a>
      </div>

      <div class="row g-4">
        <div class="col-lg-4">
          <section class="profile-panel profile-info-panel" aria-labelledby="profileInfoTitle">
            <div class="profile-avatar" aria-hidden="true">AS</div>
            <h2 class="h5 fw-bold mb-1" id="profileInfoTitle">Ashish Sharma</h2>
            <p class="text-secondary mb-4">ashish@example.com</p>

            <form>
              <div class="mb-3">
                <label class="form-label" for="usernameInput">Username</label>
                <input
                  class="form-control"
                  id="usernameInput"
                  name="username"
                  type="text"
                  value="Ashish Sharma"
                  autocomplete="name"
                  required>
                <div class="invalid-feedback">Please enter your username.</div>
              </div>

              <div class="mb-3">
                <label class="form-label" for="emailInput">Email</label>
                <input
                  class="form-control"
                  id="emailInput"
                  name="email"
                  type="email"
                  value="ashish@example.com"
                  autocomplete="email"
                  required>
                <div class="invalid-feedback">Please enter a valid email address.</div>
              </div>

              <div class="mb-3">
                <label class="form-label" for="profileImageInput">Profile image URL</label>
                <input
                  class="form-control"
                  id="profileImageInput"
                  name="profileImage"
                  type="url"
                  placeholder="Optional image URL"
                  autocomplete="url">
              </div>

              <button class="btn btn-success w-100" type="submit">Save profile</button>
            </form>
          </section>

          <section class="profile-panel mt-4" aria-labelledby="accountActionsTitle">
            <h2 class="h5 fw-bold mb-3" id="accountActionsTitle">Account Actions</h2>
            <div class="d-grid gap-2">
              <a class="btn btn-outline-success" href="login.html">Logout</a>
              <button class="btn btn-outline-danger" type="button">Delete account</button>
            </div>
          </section>
        </div>

       
    </section>
  </main>

  <div id="footerInclude"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./js/common.js"></script>
</body>
</html>
