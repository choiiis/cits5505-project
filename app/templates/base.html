<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TableTrail{% endblock %}</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}">

    {% block styles %}{% endblock %}
</head>

<body {% block body_attrs %}{% endblock %}>
    <header class="site-header">
        <nav class="navbar navbar-expand-md bg-white py-1">
            <div class="container-fluid px-5 py-1">
                <a class="navbar-brand site-header__brand" href="{{ url_for('home') }}">TableTrail</a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#headerNav"
                    aria-controls="headerNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="headerNav">
                    <ul class="navbar-nav ms-auto mb-3 mb-md-0 gap-md-3 me-md-4">
                        <li class="nav-item">
                            <a class="nav-link site-header__link active" href="{{ url_for('home') }}">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link site-header__link" href="#">Search</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link site-header__link" href="#">Bookmarks</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link site-header__link" href="#">Profile</a>
                        </li>
                    </ul>

                    {% if session.get("user_id") %}
                    <a class="btn btn-dark site-header__login" href="{{ url_for('logout') }}">Logout</a>
                    {% else %}
                    <a class="btn btn-dark site-header__login" href="{{ url_for('login') }}">Login</a>
                    {% endif %}
                </div>
            </div>
        </nav>
    </header>

    {% block content %}{% endblock %}

    <footer class="shared-footer bg-white py-4 mt-auto">
        <div class="container-fluid px-5 d-flex justify-content-between align-items-center">
            <p class="mb-0 small text-secondary">TableTrail restaurant discovery platform</p>

            <div class="d-none d-md-block">
                <p class="mb-0 small text-secondary">© 2026 TableTrail</p>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    {% block scripts %}{% endblock %}
</body>

</html>
