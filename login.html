<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | TableTrail</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/styles.css" rel="stylesheet">
</head>
<body data-page="login">
  <main class="auth-shell container d-flex align-items-center justify-content-center py-5">
    <section class="form-card bg-white shadow-sm p-4 w-100">
      <h1 class="h3 fw-bold">Welcome back</h1>
      <p class="text-secondary">Log in to save restaurants, manage reviews, and access your profile.</p>
      <form>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input class="form-control" type="email" placeholder="you@example.com">
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input class="form-control" type="password" placeholder="Password">
        </div>
        <button class="btn btn-success w-100" type="button">Login</button>
      </form>
      <div class="d-flex justify-content-between mt-3 small">
        <a href="signup.html">Create account</a>
        <a href="forgot-password.html">Forgot password?</a>
      </div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/components.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
