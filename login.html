<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | TableTrail</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="./css/common.css" rel="stylesheet">
  <link href="./css/login.css" rel="stylesheet">
</head>
<body data-page="login">
  <div id="headerInclude"></div>

  <main class="auth-shell container d-flex align-items-center justify-content-center py-5">
    <section class="form-card bg-white shadow-sm p-4 w-100">
      <h1 class="h3 fw-bold">Welcome back</h1>
      <p class="text-secondary">Log in to save restaurants, manage reviews, and access your profile.</p>

      <form id="loginForm" novalidate>
        <div class="mb-3">
          <label class="form-label" for="emailInput">Email</label>
          <input
            class="form-control"
            id="emailInput"
            name="email"
            type="email"
            placeholder="you@example.com"
            autocomplete="email"
            required>
          <div class="invalid-feedback">Please enter a valid email address.</div>
        </div>

        <div class="mb-3">
          <label class="form-label" for="passwordInput">Password</label>
          <input
            class="form-control"
            id="passwordInput"
            name="password"
            type="password"
            placeholder="Password"
            autocomplete="current-password"
            required>
          <div class="invalid-feedback">Password must be at least 6 characters.</div>
        </div>

        <button class="btn btn-success w-100 login-submit" type="submit">Login</button>
        <p class="login-message mb-0 mt-3" id="loginMessage" role="status" aria-live="polite"></p>
      </form>

      <div class="d-flex justify-content-between mt-3 small">
        <a href="signup.html">Create account</a>
        <a href="forgot-password.html">Forgot password?</a>
      </div>
    </section>
  </main>

  <div id="footerInclude"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./js/common.js"></script>
  <script src="./js/login.js"></script>
</body>
</html>
